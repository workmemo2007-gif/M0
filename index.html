<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم الملكي - قائمة الطعام الإلكترونية</title>
    
    <!-- Google Fonts: Aref Ruqaa & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: rgba(212, 175, 55, 0.3);
            --header-overlay: rgba(0, 0, 0, 0.5);
            --shadow-color: rgba(0, 0, 0, 0.08);
            --accent-green: #25d366;
            --glass-bg: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.3);
            --silver-grad: linear-gradient(135deg, #e0e0e0 0%, #bdc3c7 50%, #95a5a6 100%);
            --card-radius: 12px;
        }

        body.dark-mode {
            --bg-body: #0d0f12;
            --bg-card: #161b22;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(212, 175, 55, 0.4);
            --header-overlay: rgba(0, 0, 0, 0.75);
            --shadow-color: rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --silver-grad: linear-gradient(135deg, #7f8c8d 0%, #4a5568 50%, #2d3748 100%);
        }

        html { scroll-behavior: smooth; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        .glass-icon {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Top Nav - Compact Icons (تعديل رقم 5) */
        .top-nav {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
        }

        .social-icons {
            display: flex;
            gap: 6px;
        }

        .social-icons a {
            color: #ffffff;
            font-size: 0.85rem;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .theme-toggle-btn {
            border: 1px solid var(--primary-gold);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            font-weight: bold;
        }

        /* Hero Header */
        .hero-header {
            position: relative;
            height: 180px;
            background: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            padding: 15px;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--header-overlay);
        }

        .branding-container {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-frame {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--primary-gold);
            overflow: hidden;
            background: #000;
            flex-shrink: 0;
        }

        .logo-frame img { width: 100%; height: 100%; object-fit: cover; }

        .restaurant-info h1 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 1.6rem;
            color: #ffffff;
            line-height: 1.1;
        }

        .restaurant-info p {
            color: var(--primary-gold);
            font-size: 0.75rem;
        }

        /* Service Actions (تعديل رقم 1: حذف الاتصال المباشر) */
        .service-actions-container {
            padding: 10px 12px 5px;
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 5px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            border: none;
            text-decoration: none;
        }

        .call-waiter-btn { background-color: var(--accent-green); color: #ffffff; }
        .location-btn { background: var(--silver-grad); color: #1a202c; }

        .tab-page { display: none; padding: 10px 12px; }
        .tab-page.active { display: block; }

        /* Carousel Slider */
        .ads-carousel {
            position: relative;
            width: 100%;
            height: 130px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .carousel-slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 10px;
        }

        .carousel-slide.active { opacity: 1; }
        .slide-caption {
            background: rgba(0,0,0,0.65);
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            border-right: 3px solid var(--primary-gold);
        }

        /* Horizontal Popular Items Scroll (تعديل رقم 3) */
        .popular-horizontal-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .popular-horizontal-scroll::-webkit-scrollbar { display: none; }

        .popular-horizontal-scroll .product-card {
            flex: 0 0 145px; /* عرض ثابت للكروت في القائمة الافقية */
            width: 145px;
        }

        /* Compact Products Grid (تعديل رقم 2: تصغير الأطباق لتكون جنباً إلى جنب) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* طبقين جنباً إلى جنب */
            gap: 10px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .product-img-wrapper { position: relative; height: 95px; width: 100%; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .product-price-badge {
            position: absolute; bottom: 4px; left: 4px;
            background: rgba(0, 0, 0, 0.8);
            color: var(--primary-gold);
            border: 1px solid var(--primary-gold);
            padding: 2px 6px; border-radius: 12px;
            font-size: 0.7rem; font-weight: 800;
        }

        .product-content { padding: 8px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
        .product-desc { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 6px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .add-to-cart-btn {
            width: 100%; background: transparent;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 5px; border-radius: 8px;
            font-size: 0.75rem; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }

        .qty-controls {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(212, 175, 55, 0.1); border-radius: 8px;
            padding: 2px 5px; border: 1px solid var(--primary-gold);
            font-size: 0.8rem;
        }

        .qty-btn {
            background: var(--primary-gold); color: #000; border: none;
            width: 22px; height: 22px; border-radius: 4px; font-weight: bold; cursor: pointer;
        }

        /* Reviews Section */
        .reviews-section {
            margin-top: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 12px;
        }

        .review-card {
            background: rgba(212, 175, 55, 0.05);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--primary-gold);
            margin-bottom: 3px;
        }

        .review-text { font-size: 0.75rem; color: var(--text-main); }

        .add-review-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .add-review-form input, .add-review-form textarea {
            width: 100%;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-main);
            font-size: 0.78rem;
        }

        .add-review-btn {
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 6px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Glass Categories List */
        .glass-categories-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .glass-category-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-right: 3px solid var(--primary-gold);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Floating Order Notification Bar */
        .cart-notification-bar {
            position: fixed; bottom: 65px; left: 12px; right: 12px;
            background: var(--primary-gold); color: #000;
            padding: 8px 14px; border-radius: 25px;
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 0.82rem;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            z-index: 90; cursor: pointer; display: none;
        }

        /* Bottom Navigation Bar */
        .bottom-nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 55px; background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-muted); font-size: 0.7rem; font-weight: 700;
            text-decoration: none; cursor: pointer; gap: 2px;
        }

        .nav-item i { font-size: 1.1rem; }
        .nav-item.active { color: var(--primary-gold); }

        /* Cart Page */
        .cart-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 12px;
        }

        .order-options { display: flex; gap: 8px; margin: 12px 0; }
        .order-type-btn {
            flex: 1; padding: 7px; border-radius: 8px;
            border: 1px solid var(--border-color); background: transparent;
            color: var(--text-main); font-size: 0.8rem; font-weight: 600; cursor: pointer;
        }

        .order-type-btn.active { background: var(--primary-gold); color: #000; border-color: var(--primary-gold); }

        .form-fields { display: grid; gap: 6px; margin-bottom: 12px; }
        .form-fields input {
            width: 100%; padding: 8px; border-radius: 6px;
            border: 1px solid var(--border-color); background: transparent;
            color: var(--text-main); font-size: 0.8rem;
        }

        .submit-order-btn {
            width: 100%; background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff; border: none; padding: 10px; border-radius: 8px;
            font-weight: 700; font-size: 0.9rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        .cart-line-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0; border-bottom: 1px dashed var(--border-color);
            font-size: 0.8rem;
        }

        .section-title {
            font-size: 1.05rem; font-weight: 700; margin-bottom: 10px;
            color: var(--primary-gold); display: flex; align-items: center; gap: 6px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar (تعديل رقم 5: أزرار مصغرة) -->
    <div class="top-nav">
        <div class="social-icons">
            <a href="#" class="glass-icon"><i class="fab fa-instagram"></i></a>
            <a href="#" class="glass-icon"><i class="fab fa-tiktok"></i></a>
            <a href="#" class="glass-icon"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="glass-icon"><i class="fab fa-snapchat-ghost"></i></a>
        </div>
        <button class="theme-toggle-btn glass-icon" id="themeToggleBtn" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
            <span id="themeText">الداكن</span>
        </button>
    </div>

    <!-- Header -->
    <header class="hero-header">
        <div class="hero-overlay"></div>
        <div class="branding-container">
            <div class="logo-frame">
                <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=300&q=80" alt="Logo">
            </div>
            <div class="restaurant-info">
                <h1>مطعم الملكي</h1>
                <p>Digital QR Menu & Fine Dining</p>
            </div>
        </div>
    </header>

    <!-- Actions (تعديل رقم 1: إزالة الاتصال المباشر) -->
    <div class="service-actions-container">
        <button class="action-btn call-waiter-btn" onclick="callWaiter()"><i class="fas fa-bell"></i> نداء الويتر</button>
        <a href="https://maps.google.com/?q=Al-Diwaniyah,Iraq" target="_blank" class="action-btn location-btn"><i class="fas fa-map-marker-alt"></i> موقع المطعم</a>
    </div>

    <!-- PAGE 1: HOME -->
    <div id="homePage" class="tab-page active">
        <!-- Moving Carousel Banner -->
        <div class="ads-carousel">
            <div class="carousel-slide active" style="background-image: url('https://images.unsplash.com/photo-1544025162-d76694265947?w=800');">
                <div class="slide-caption">🔥 عروض شاورما اللحم العائلية - خصم 20%</div>
            </div>
            <div class="carousel-slide" style="background-image: url('https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=800');">
                <div class="slide-caption">🍗 فروج مشوي طازج يومياً على الفحم</div>
            </div>
        </div>

        <!-- Most Popular Dishes (تعديل رقم 3: التمرير الأفقي) -->
        <div class="section-title"><i class="fas fa-fire"></i> الأطباق الأكثر طلباً</div>
        <div class="popular-horizontal-scroll" id="popularGrid"></div>

        <!-- Customer Reviews (تعديل رقم 4: حفض واسترجاع التعليقات للجميع عبر LocalStorage) -->
        <div class="reviews-section">
            <div class="section-title"><i class="fas fa-comments"></i> تعليقات الزبائن</div>
            <div id="reviewsContainer"></div>
            
            <div class="add-review-form">
                <input type="text" id="reviewerName" placeholder="اسمك">
                <textarea id="reviewerComment" rows="2" placeholder="اكتب تعليقك عن المطعم..."></textarea>
                <button class="add-review-btn" onclick="addReview()">إضافة تعليق</button>
            </div>
        </div>
    </div>

    <!-- PAGE 2: CATEGORIES -->
    <div id="categoriesPage" class="tab-page">
        <div class="section-title"><i class="fas fa-list"></i> أقسام القائمة</div>
        <div class="glass-categories-grid" id="glassCategoriesGrid"></div>
        
        <div id="categoryProductsContainer" style="display:none; margin-top:10px;">
            <button class="add-to-cart-btn" onclick="backToCategoriesList()" style="margin-bottom:10px; width:auto; padding: 4px 12px;">
                <i class="fas fa-arrow-right"></i> العودة للأقسام
            </button>
            <div class="section-title" id="selectedCategoryTitle"></div>
            <!-- تعديل رقم 2: شبكة أطباق مصغرة متجاورة -->
            <div class="products-grid" id="categoryProductsGrid"></div>
        </div>
    </div>

    <!-- PAGE 3: CART -->
    <div id="cartPage" class="tab-page">
        <div class="section-title"><i class="fas fa-shopping-cart"></i> سلة الطلبات</div>
        <div class="cart-container">
            <div id="cartItemsList"></div>
            
            <div style="display:flex; justify-content:space-between; margin:12px 0; font-weight:bold; font-size:1rem;">
                <span>الإجمالي الكلي:</span>
                <span id="cartGrandTotal" style="color:var(--primary-gold);">0 د.ع</span>
            </div>

            <div class="order-options">
                <button class="order-type-btn active" id="btnInHouse" onclick="setOrderType('inhouse')"><i class="fas fa-chair"></i> داخل المطعم</button>
                <button class="order-type-btn" id="btnDelivery" onclick="setOrderType('delivery')"><i class="fas fa-motorcycle"></i> توصيل</button>
            </div>

            <div class="form-fields" id="formFields">
                <input type="text" id="tableNum" placeholder="رقم الطاولة (مثال: 5)">
            </div>

            <button class="submit-order-btn" onclick="sendOrder()"><i class="fab fa-whatsapp"></i> إرسال الطلب عبر واتساب</button>
        </div>
    </div>

    <!-- Floating Count Notification Bar -->
    <div class="cart-notification-bar" id="cartNotificationBar" onclick="switchTab('cart')">
        <span>عرض السلة (<span id="notifyCount">0</span> وجبات)</span>
        <i class="fas fa-chevron-left"></i>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav-bar">
        <div class="nav-item active" id="nav-home" onclick="switchTab('home')">
            <i class="fas fa-home"></i>
            <span>المنزل</span>
        </div>
        <div class="nav-item" id="nav-categories" onclick="switchTab('categories')">
            <i class="fas fa-th-large"></i>
            <span>الأقسام</span>
        </div>
        <div class="nav-item" id="nav-cart" onclick="switchTab('cart')">
            <i class="fas fa-shopping-basket"></i>
            <span>السلة</span>
        </div>
    </div>

          {"ID": 28, "Category": "شاورما اللحم", "name": "نصف كيلو شاورما لحم", "price": 22000, "image": "https://images.unsplash.com/photo-1561651823-34feb02250e4?w=500", "desc": "شاورما لحم - طرطور"},
          {"ID": 29, "Category": "شاورما اللحم", "name": "كيلو شاورما لحم", "price": 40000, "image": "https://images.unsplash.com/photo-1561651823-34feb02250e4?w=500", "desc": "شاورما لحم - طرطور"},
          {"ID": 30, "Category": "فروج", "name": "فروج شريف مشوي", "price": 13000, "image": "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=500", "desc": "دجاج شوي - بطاطا - ثومية", "popular": true},
          {"ID": 31, "Category": "فروج", "name": "نصف فروج مشوي", "price": 7000, "image": "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=500", "desc": "دجاج شوي - بطاطا"},
          {"ID": 32, "Category": "فروج", "name": "فروج مشوي مع رز", "price": 16000, "image": "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=500", "desc": "فروج مشوي - رز - ثومية"},
          {"ID": 33, "Category": "فروج", "name": "نصف فروج مع رز", "price": 9000, "image": "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=500", "desc": "نصف فروج - رز - ثومية"},
          {"ID": 34, "Category": "ريزو", "name": "ريزو شاورما دجاج", "price": 5000, "image": "https://images.unsplash.com/photo-1512058564366-18510be2db19?w=500", "desc": "دجاج - صلصة ريزو"},
          {"ID": 35, "Category": "ريزو", "name": "ريزو شاورما لحم", "price": 7000, "image": "https://images.unsplash.com/photo-1512058564366-18510be2db19?w=500", "desc": "لحم - صلصة ريزو"}
        ];

        let cart = {};
        let currentOrderType = 'inhouse';

        const categoryIcons = {
            'شاورما الدجاج': 'fa-drumstick-bite',
            'شاورما اللحم': 'fa-bacon',
            'فروج': 'fa-fire',
            'ريزو': 'fa-bowl-rice',
            'المقبلات': 'fa-cheese',
            'صلصات': 'fa-pepper-hot',
            'المشروبات': 'fa-glass-martini-alt'
        };

        // التعليقات الأساسية الافتراضية
        const defaultReviews = [
            { name: "أحمد العراقي", stars: "⭐⭐⭐⭐⭐", text: "أفضل شاورما في المحافظة، الطعم خرافي والخدمة ممتازة!" },
            { name: "سارة علي", stars: "⭐⭐⭐⭐⭐", text: "الفروج المشوي مع الرز طعمه رائع جداً والنظافة 10/10." }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderPopularProducts();
            renderGlassCategories();
            renderReviews();
            startCarousel();
        });

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeText').textContent = isDark ? 'الفاتح' : 'الداكن';
            document.querySelector('#themeToggleBtn i').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            document.getElementById(tabName + 'Page').classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');

            if (tabName === 'cart') {
                renderCartDetails();
            }
        }

        function startCarousel() {
            const slides = document.querySelectorAll('.carousel-slide');
            let index = 0;
            setInterval(() => {
                slides[index].classList.remove('active');
                index = (index + 1) % slides.length;
                slides[index].classList.add('active');
            }, 3500);
        }

        function renderPopularProducts() {
            const popularItems = rawProducts.filter(p => p.popular);
            document.getElementById('popularGrid').innerHTML = popularItems.map(product => createProductCardHTML(product)).join('');
        }

        function renderGlassCategories() {
            const categories = [...new Set(rawProducts.map(p => p.Category))];
            document.getElementById('glassCategoriesGrid').innerHTML = categories.map(cat => {
                const icon = categoryIcons[cat] || 'fa-utensils';
                return `
                    <div class="glass-category-card" onclick="openCategoryProducts('${cat}')">
                        <span><i class="fas ${icon}" style="margin-left: 6px; color: var(--primary-gold);"></i> ${cat}</span>
                        <i class="fas fa-chevron-left"></i>
                    </div>
                `;
            }).join('');
        }

        function openCategoryProducts(catName) {
            document.getElementById('glassCategoriesGrid').style.display = 'none';
            const container = document.getElementById('categoryProductsContainer');
            container.style.display = 'block';

            document.getElementById('selectedCategoryTitle').innerHTML = `<i class="fas ${categoryIcons[catName] || 'fa-utensils'}"></i> ${catName}`;
            
            const catProducts = rawProducts.filter(p => p.Category === catName);
            document.getElementById('categoryProductsGrid').innerHTML = catProducts.map(product => createProductCardHTML(product)).join('');
        }

        function backToCategoriesList() {
            document.getElementById('glassCategoriesGrid').style.display = 'flex';
            document.getElementById('categoryProductsContainer').style.display = 'none';
        }

        /* تعديل رقم 2: بطاقة طبق مصغرة وبحجم متناسق للعرض المزدوج */
        function createProductCardHTML(product) {
            const qty = cart[product.ID] || 0;
            return `
                <div class="product-card">
                    <div class="product-img-wrapper">
                        <img src="${product.image}" alt="${product.name}" class="product-img">
                        <div class="product-price-badge">${product.price.toLocaleString()} د.ع</div>
                    </div>
                    <div class="product-content">
                        <div>
                            <h3 class="product-title">${product.name}</h3>
                            <p class="product-desc">${product.desc}</p>
                        </div>
                        <div>
                            ${qty === 0 ? `
                                <button class="add-to-cart-btn" onclick="updateCart(${product.ID}, 1)">
                                    <i class="fas fa-plus"></i> إضافة
                                </button>
                            ` : `
                                <div class="qty-controls">
                                    <button class="qty-btn" onclick="updateCart(${product.ID}, ${qty - 1})">-</button>
                                    <span>${qty}</span>
                                    <button class="qty-btn" onclick="updateCart(${product.ID}, ${qty + 1})">+</button>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function updateCart(productId, newQty) {
            if (newQty <= 0) {
                delete cart[productId];
            } else {
                cart[productId] = newQty;
            }
            
            renderPopularProducts();
            if (document.getElementById('categoryProductsContainer').style.display !== 'none') {
                const currentCat = document.getElementById('selectedCategoryTitle').innerText.trim();
                const catProducts = rawProducts.filter(p => p.Category === currentCat);
                document.getElementById('categoryProductsGrid').innerHTML = catProducts.map(product => createProductCardHTML(product)).join('');
            }
            if (document.getElementById('cartPage').classList.contains('active')) {
                renderCartDetails();
            }

            updateFloatingBar();
        }

        function updateFloatingBar() {
            let totalItems = 0;
            for (let id in cart) totalItems += cart[id];

            const bar = document.getElementById('cartNotificationBar');
            if (totalItems > 0) {
                bar.style.display = 'flex';
                document.getElementById('notifyCount').textContent = totalItems;
            } else {
                bar.style.display = 'none';
            }
        }

        function renderCartDetails() {
            let listHTML = '';
            let grandTotal = 0;
            let totalItems = 0;

            for (let id in cart) {
                const product = rawProducts.find(p => p.ID == id);
                if (product) {
                    const qty = cart[id];
                    const itemTotal = qty * product.price;
                    grandTotal += itemTotal;
                    totalItems += qty;
                    listHTML += `
                        <div class="cart-line-item">
                            <div>
                                <strong>${product.name}</strong> × ${qty}
                            </div>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span>${itemTotal.toLocaleString()} د.ع</span>
                                <button class="qty-btn" onclick="updateCart(${product.ID}, 0)">×</button>
                            </div>
                        </div>
                    `;
                }
            }

            if (totalItems === 0) {
                document.getElementById('cartItemsList').innerHTML = '<p style="text-align:center; color:var(--text-muted); padding: 15px 0; font-size:0.85rem;">سلة الطلبات فارغة حالياً</p>';
            } else {
                document.getElementById('cartItemsList').innerHTML = listHTML;
            }

            document.getElementById('cartGrandTotal').textContent = grandTotal.toLocaleString() + ' د.ع';
        }

        /* تعديل رقم 4: إظهار وتخزين التعليقات محلياً ليراها كل الزبائن */
        function renderReviews() {
            let savedReviews = JSON.parse(localStorage.getItem('almalaki_reviews')) || defaultReviews;
            const container = document.getElementById('reviewsContainer');
            container.innerHTML = savedReviews.map(r => `
                <div class="review-card">
                    <div class="review-header"><span>${r.name}</span> <span>${r.stars}</span></div>
                    <div class="review-text">${r.text}</div>
                </div>
            `).join('');
        }

        function addReview() {
            const name = document.getElementById('reviewerName').value.trim();
            const text = document.getElementById('reviewerComment').value.trim();

            if (!name || !text) {
                alert("يرجى إدخال اسمك وتعليقك.");
                return;
            }

            let savedReviews = JSON.parse(localStorage.getItem('almalaki_reviews')) || defaultReviews;
            savedReviews.unshift({ name: name, stars: "⭐⭐⭐⭐⭐", text: text });
            localStorage.setItem('almalaki_reviews', JSON.stringify(savedReviews));

            renderReviews();

            document.getElementById('reviewerName').value = '';
            document.getElementById('reviewerComment').value = '';
        }

        function setOrderType(type) {
            currentOrderType = type;
            const btnInHouse = document.getElementById('btnInHouse');
            const btnDelivery = document.getElementById('btnDelivery');
            const formFields = document.getElementById('formFields');

            if (type === 'inhouse') {
                btnInHouse.classList.add('active');
                btnDelivery.classList.remove('active');
                formFields.innerHTML = `<input type="text" id="tableNum" placeholder="رقم الطاولة (مثال: 5)">`;
            } else {
                btnDelivery.classList.add('active');
                btnInHouse.classList.remove('active');
                formFields.innerHTML = `
                    <input type="text" id="custName" placeholder="الاسم الكامل">
                    <input type="text" id="custPhone" placeholder="رقم الهاتف">
                    <input type="text" id="custAddress" placeholder="العنوان بالتفصيل">
                `;
            }
        }

        function callWaiter() {
            const phoneNumber = "9647723681360";
            const message = encodeURIComponent("مرحباً، أود نداء النادل إلى الطاولة يرجى المساعدة.");
            window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
        }

        function sendOrder() {
            const targetPhone = "9647723681360";
            const cartIds = Object.keys(cart);
            if (cartIds.length === 0) {
                alert("يرجى اختيار وجبات وإضافتها للسلة أولاً قبل إرسال الطلب.");
                return;
            }

            let message = "مرحباً مطعم الملكي، أود إرسال طلب جديد:\n\n📋 **تفاصيل الطلب:**\n";
            let grandTotal = 0;

            cartIds.forEach(id => {
                const product = rawProducts.find(p => p.ID == id);
                if (product) {
                    const qty = cart[id];
                    const itemTotal = qty * product.price;
                    grandTotal += itemTotal;
                    message += `• ${product.name} (عدد ${qty}) = ${itemTotal.toLocaleString()} د.ع\n`;
                }
            });

            message += `\n💰 **المجموع الكلي:** ${grandTotal.toLocaleString()} د.ع\n\n`;

            if (currentOrderType === 'inhouse') {
                const table = document.getElementById('tableNum') ? document.getElementById('tableNum').value : '';
                if (!table) { alert("يرجى إدخال رقم الطاولة"); return; }
                message += `🪑 **نوع الطلب:** داخل المطعم\n📍 **رقم الطاولة:** ${table}`;
            } else {
                const name = document.getElementById('custName').value;
                const phone = document.getElementById('custPhone').value;
                const address = document.getElementById('custAddress').value;
                if (!name || !phone || !address) { alert("يرجى ملء جميع حقول بيانات التوصيل"); return; }
                message += `🛵 **نوع الطلب:** دليفري / توصيل\n👤 **الاسم:** ${name}\n📞 **رقم الهاتف:** ${phone}\n📍 **العنوان:** ${address}`;
            }

            window.open(`https://wa.me/${targetPhone}?text=${encodeURIComponent(message)}`, '_blank');
        }
    </script>
</body>
</html>
