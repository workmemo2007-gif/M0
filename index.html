<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital QR Menu - قائمة الطعام الإلكترونية</title>
    
    <!-- Google Fonts: Aref Ruqaa & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --bg-body: #f8f9fa;
            --bg-card: rgba(255, 255, 255, 0.9);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: rgba(212, 175, 55, 0.3);
            --header-overlay: rgba(0, 0, 0, 0.45);
            --shadow-color: rgba(0, 0, 0, 0.08);
            --accent-green: #25d366;
            --accent-green-hover: #1da851;
        }

        body.dark-mode {
            --bg-body: #0d0f12;
            --bg-card: rgba(22, 27, 34, 0.75);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(212, 175, 55, 0.4);
            --header-overlay: rgba(0, 0, 0, 0.7);
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        /* Top Bar & Theme Switcher */
        .top-nav {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .social-icons {
            display: flex;
            gap: 12px;
        }

        .social-icons a {
            color: #ffffff;
            font-size: 1.1rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            background: var(--primary-gold);
            color: #000;
            transform: translateY(-2px);
        }

        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid var(--primary-gold);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* Hero Header */
        .hero-header {
            position: relative;
            height: 260px;
            background: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--header-overlay);
        }

        .branding-container {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .logo-frame {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 0 15px var(--gold-glow);
            overflow: hidden;
            background: #000;
            flex-shrink: 0;
        }

        .logo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .restaurant-info h1 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 2.2rem;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            line-height: 1.2;
        }

        .restaurant-info p {
            color: var(--primary-gold);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Service Call Button */
        .service-call-container {
            padding: 15px 20px 5px;
        }

        .call-waiter-btn {
            width: 100%;
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            transition: all 0.3s ease;
        }

        .call-waiter-btn:hover {
            background-color: var(--accent-green-hover);
            transform: translateY(-2px);
        }

        /* Categories Bar */
        .categories-wrapper {
            padding: 15px 0 10px;
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--bg-body);
            backdrop-filter: blur(10px);
        }

        .categories-bar {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 0 20px;
            scrollbar-width: none;
        }

        .categories-bar::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            flex: 0 0 auto;
            padding: 10px 18px;
            border-radius: 25px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .category-chip.active {
            background: var(--primary-gold);
            color: #000;
            border-color: var(--primary-gold);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        /* Empty State (No Products Displayed) */
        .content-placeholder {
            text-align: center;
            padding: 50px 20px;
            margin: 20px;
            background: var(--bg-card);
            border: 1px dashed var(--border-color);
            border-radius: 16px;
            backdrop-filter: blur(8px);
        }

        .content-placeholder i {
            font-size: 3rem;
            color: var(--primary-gold);
            margin-bottom: 15px;
        }

        .content-placeholder h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .content-placeholder p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Order System & Bottom Cart Floating Bar */
        .cart-bar-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -5px 25px var(--shadow-color);
            padding: 15px 20px;
            z-index: 100;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .order-options {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .order-type-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .order-type-btn.active {
            background: var(--primary-gold);
            color: #000;
            border-color: var(--primary-gold);
        }

        .form-fields {
            display: grid;
            gap: 8px;
            margin-bottom: 12px;
        }

        .form-fields input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        .submit-order-btn {
            width: 100%;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Top Navigation with Social Links & Theme Switcher -->
    <div class="top-nav">
        <div class="social-icons">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-snapchat-ghost"></i></a>
        </div>
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
            <span id="themeText">النمط الداكن</span>
        </button>
    </div>

    <!-- Hero Header & Branding -->
    <header class="hero-header">
        <div class="hero-overlay"></div>
        <div class="branding-container">
            <div class="logo-frame">
                <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=300&q=80" alt="Restaurant Logo">
            </div>
            <div class="restaurant-info">
                <h1>مطعم الملكي</h1>
                <p>Digital QR Menu & Fine Dining</p>
            </div>
        </div>
    </header>

    <!-- Service Call Button -->
    <div class="service-call-container">
        <button class="call-waiter-btn" onclick="callWaiter()">
            <i class="fas fa-bell"></i>
            اطلب النادل / نداء الويتر
        </button>
    </div>

    <!-- Categories Horizontal Bar -->
    <div class="categories-wrapper">
        <div class="categories-bar">
            <div class="category-chip active"><i class="fas fa-drumstick-bite"></i> مشويات</div>
            <div class="category-chip"><i class="fas fa-cheese"></i> مقبلات</div>
            <div class="category-chip"><i class="fas fa-utensils"></i> أطباق رئيسية</div>
            <div class="category-chip"><i class="fas fa-glass-martini-alt"></i> مشروبات</div>
            <div class="category-chip"><i class="fas fa-ice-cream"></i> حلويات</div>
            <div class="category-chip"><i class="fas fa-tags"></i> العروض الخاصة</div>
        </div>
    </div>

    <!-- Placeholder Section (No Dish Products Rendered) -->
    <div class="content-placeholder">
        <i class="fas fa-concierge-bell"></i>
        <h3>أهلاً بكم في مطعمنا</h3>
        <p>يرجى اختيار نوع الطلب أدناه وإدخال التفاصيل لإرسال الحجز أو الطلب مباشر إلى الإدارة عبر واتساب.</p>
    </div>

    <!-- Horizontal Order & WhatsApp Cart System -->
    <div class="cart-bar-container">
        <div class="order-options">
            <button class="order-type-btn active" id="btnInHouse" onclick="setOrderType('inhouse')">
                <i class="fas fa-chair"></i> داخل المطعم
            </button>
            <button class="order-type-btn" id="btnDelivery" onclick="setOrderType('delivery')">
                <i class="fas fa-motorcycle"></i> طلب دليفري
            </button>
        </div>

        <!-- Dynamic Form Fields -->
        <div class="form-fields" id="formFields">
            <input type="text" id="tableNum" placeholder="رقم الطاولة (مثال: 5)">
        </div>

        <button class="submit-order-btn" onclick="sendOrder()">
            <i class="fab fa-whatsapp"></i> إرسال الطلب عبر واتساب
        </button>
    </div>

    <script>
        let currentOrderType = 'inhouse';

        // Theme Toggle Functionality
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            const themeText = document.getElementById('themeText');
            const themeIcon = document.querySelector('#themeToggleBtn i');

            if (isDark) {
                themeText.textContent = 'النمط الفاتح';
                themeIcon.className = 'fas fa-sun';
            } else {
                themeText.textContent = 'النمط الداكن';
                themeIcon.className = 'fas fa-moon';
            }
        }

        // Call Waiter Function
        function callWaiter() {
            const phoneNumber = "07893035416";
            const message = encodeURIComponent("مرحباً، أود نداء النادل إلى الطاولة يرجى المساعدة.");
            window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
        }

        // Switch Order Type (In-House / Delivery)
        function setOrderType(type) {
            currentOrderType = type;
            const btnInHouse = document.getElementById('btnInHouse');
            const btnDelivery = document.getElementById('btnDelivery');
            const formFields = document.getElementById('formFields');

            if (type === 'inhouse') {
                btnInHouse.classList.add('active');
                btnDelivery.classList.remove('active');
                formFields.innerHTML = `
                    <input type="text" id="tableNum" placeholder="رقم الطاولة (مثال: 5)">
                `;
            } else {
                btnDelivery.classList.add('active');
                btnInHouse.classList.remove('active');
                formFields.innerHTML = `
                    <input type="text" id="custName" placeholder="الاسم الكامل">
                    <input type="text" id="custPhone" placeholder="رقم الهاتف">
                    <input type="text" id="custAddress" placeholder="العنوان بالتفصيل">
                `;
            }
        }

        // Send Order via WhatsApp
        function sendOrder() {
            const targetPhone = "077236813660";
            let message = "مرحباً، أود إرسال طلب جديد:\n\n";

            if (currentOrderType === 'inhouse') {
                const table = document.getElementById('tableNum').value;
                if (!table) {
                    alert("يرجى إدخال رقم الطاولة");
                    return;
                }
                message += `نوع الطلب: داخل المطعم\nرقم الطاولة: ${table}`;
            } else {
                const name = document.getElementById('custName').value;
                const phone = document.getElementById('custPhone').value;
                const address = document.getElementById('custAddress').value;

                if (!name || !phone || !address) {
                    alert("يرجى ملء جميع حقول بيانات التوصيل");
                    return;
                }
                message += `نوع الطلب: دليفري\nالاسم: ${name}\nالهاتف: ${phone}\nالعنوان: ${address}`;
            }

            window.open(`https://wa.me/${targetPhone}?text=${encodeURIComponent(message)}`, '_blank');
        }
    </script>
</body>
</html>
